version: '3'

services:
  next:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs-container
    volumes:
      - ./src:/home/node/src
    ports:
      - 3000:3000
      - 5555:5555
    networks:
      - app_network
    tty: true
    stdin_open: true
    depends_on:
      - db
  db:
    image: postgres:15
    hostname: db
    env_file:
      - ./.env
    networks:
      - app_network
    environment:
      - TZ=Asia/Tokyo
      - POSTGRES_DB=$DB_NAME
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASS
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

networks:
  app_network:
    driver: bridge
volumes:
  db_data: